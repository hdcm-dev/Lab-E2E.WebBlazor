# Compila la aplicación Android de Movilidad Urbana y deja el APK como artefacto.
#
# Antes de compilar corre las pruebas de los ViewModels: compilan las capas de la aplicación como archivos
# enlazados en net10.0, así que no necesitan el workload.
# El APK de Release se firma con la clave de depuración del runner: sirve para instalarlo en un
# teléfono de prueba, no para publicarlo en una tienda.
name: Android — MAUI

on:
  push:
    branches: [main]
    paths:
      - 'src/MovilidadUrbana.MAUI/**'
      - 'tests/MovilidadUrbana.MAUI.Tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/MovilidadUrbana.MAUI/**'
      - 'tests/MovilidadUrbana.MAUI.Tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PROYECTO: src/MovilidadUrbana.MAUI/MovilidadUrbana.MAUI.csproj

jobs:
  compilar:
    name: Pruebas y APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar el SDK de .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pruebas de los ViewModels
        run: dotnet test tests/MovilidadUrbana.MAUI.Tests --configuration Release

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar el workload de MAUI para Android
        run: dotnet workload install maui-android

      - name: Instalar las dependencias de Android que pide el proyecto
        # La imagen del runner trae un SDK de Android, pero no garantiza la plataforma y las build-tools
        # que espera net10.0-android: este target las baja si faltan y acepta sus licencias.
        run: >-
          dotnet build ${{ env.PROYECTO }} -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publicar el APK
        run: >-
          dotnet publish ${{ env.PROYECTO }} -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory="$ANDROID_HOME" -o apk

      - name: Subir el APK
        uses: actions/upload-artifact@v7
        with:
          name: movilidad-urbana-apk
          path: apk/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
